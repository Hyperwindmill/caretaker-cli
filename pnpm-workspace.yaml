packages:
  - 'packages/*'
# Explicit so local resolution matches CI: a machine-wide override (e.g.
# minimumReleaseAge: 0 in ~/.config/pnpm/config.yaml) would otherwise let
# `pnpm update` lock day-old releases that CI's --frozen-lockfile rejects.
minimumReleaseAge: 1440
allowBuilds:
  '@vscode/vsce-sign': true
  electron-winstaller: true
  esbuild: true
  keytar: true
  protobufjs: true
# Security pins (moved here from package.json#pnpm.overrides — pnpm 10+ reads
# these from pnpm-workspace.yaml, not package.json). Values starting with `>`
# must be quoted (leading `>` is a YAML block-scalar indicator).
# Always caret, never an open `>=`: an uncapped floor resolves to the next
# major on a fresh lock (js-yaml 5 dropped its default export and broke
# @morphql/core; undici 8 and markdown-it 15 followed the same way).
overrides:
  undici: '^7.30.1'
  form-data: '^4.0.6'
  tmp: '^0.2.6'
  lodash-es: '^4.18.0'
  markdown-it: '^14.3.3'
  linkify-it: '^5.0.1'
  qs: '^6.16.0'
  js-yaml: '^4.3.2'
  'read-yaml-file>js-yaml': '^3.15.2'
  esbuild: '^0.28.1'
  tar: '^7.5.21'
